basePath: /api
definitions:
  handlers.AdjustDistractionsRequest:
    properties:
      delta:
        description: 1 or -1
        example: 1
        type: integer
    required:
    - delta
    type: object
  handlers.AuthResponse:
    properties:
      message:
        example: Login successful
        type: string
      token:
        example: eyJhbGciOiJIUzI1NiIs...
        type: string
      user:
        $ref: '#/definitions/models.User'
    type: object
  handlers.BulkCreateTasksRequest:
    properties:
      tasks:
        items:
          $ref: '#/definitions/handlers.CreateTaskRequest'
        maxItems: 200
        minItems: 1
        type: array
    required:
    - tasks
    type: object
  handlers.CachedQuote:
    properties:
      author:
        example: Jim Rohn
        type: string
      quote:
        example: Discipline is the bridge between goals and accomplishment.
        type: string
    type: object
  handlers.CreateTaskRequest:
    properties:
      category:
        description: deep-work|study|admin|gym|rest
        example: deep-work
        type: string
      date:
        description: YYYY-MM-DD
        example: "2026-03-02"
        type: string
      endTime:
        description: HH:MM, after start, ≤ 24:00
        example: "10:00"
        type: string
      energy:
        description: 1-5
        example: 4
        type: integer
      name:
        description: 1-120 chars
        example: Morning routine
        type: string
      startTime:
        description: HH:MM
        example: "09:00"
        type: string
    required:
    - category
    - date
    - endTime
    - energy
    - name
    - startTime
    type: object
  handlers.ErrorResponse:
    properties:
      details:
        example: 'Key: ''Email'' required'
        type: string
      error:
        example: Validation failed
        type: string
    type: object
  handlers.FeaturesResponse:
    properties:
      features:
        items:
          type: string
        type: array
    type: object
  handlers.LoginErrorResponse:
    properties:
      captchaRequired:
        example: false
        type: boolean
      error:
        example: invalid email or password
        type: string
    type: object
  handlers.LoginRequest:
    properties:
      email:
        example: john@example.com
        type: string
      password:
        example: securepass123
        type: string
      turnstileToken:
        description: TurnstileToken is required once the email has 3 failed logins
          in 15 minutes.
        example: 0.turnstile-token
        maxLength: 2048
        type: string
    required:
    - email
    - password
    type: object
  handlers.RegisterRequest:
    properties:
      email:
        example: john@example.com
        type: string
      name:
        example: John Doe
        maxLength: 100
        minLength: 2
        type: string
      password:
        description: 'policy: 10+ chars, max 72 bytes'
        example: securepass123
        type: string
      turnstileToken:
        description: TurnstileToken is required on public registration (not on admin
          registration).
        example: 0.turnstile-token
        maxLength: 2048
        type: string
    required:
    - email
    - name
    - password
    type: object
  handlers.SavePlanRequest:
    properties:
      tasks:
        items:
          $ref: '#/definitions/handlers.CreateTaskRequest'
        maxItems: 200
        type: array
      weekStart:
        description: a Monday
        example: "2026-11-02"
        type: string
    required:
    - weekStart
    type: object
  handlers.UpdateProfileRequest:
    properties:
      email:
        example: jane@example.com
        type: string
      name:
        example: Jane Doe
        maxLength: 100
        type: string
      newPassword:
        example: newpass456
        type: string
      oldPassword:
        description: required to change email or password
        example: oldpass123
        type: string
      timezone:
        description: IANA name
        example: Asia/Tashkent
        maxLength: 64
        type: string
    type: object
  handlers.UpdateTaskRequest:
    properties:
      category:
        example: study
        type: string
      date:
        example: "2026-03-02"
        type: string
      distractions:
        example: 2
        type: integer
      endTime:
        example: "11:00"
        type: string
      energy:
        example: 3
        type: integer
      name:
        example: Updated task name
        type: string
      startTime:
        example: "09:30"
        type: string
      status:
        example: completed
        type: string
    type: object
  handlers.UserResponse:
    properties:
      user:
        $ref: '#/definitions/models.User'
    type: object
  models.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      role:
        type: string
      timezone:
        description: IANA name
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Backend API for the Discipline productivity app
  title: Discipline API
  version: "1.0"
paths:
  /admin/register:
    post:
      consumes:
      - application/json
      description: Creates a new user account with role "admin". Only accessible by
        admins.
      parameters:
      - description: Admin registration data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Register a new admin (admin only)
      tags:
      - Admin
  /analytics:
    get:
      description: Proxies request to the Python analytics microservice securely using
        the authenticated user's ID.
      parameters:
      - description: Report range (week or month, defaults to week)
        example: week
        in: query
        name: range
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get productivity analytics
      tags:
      - Analytics
  /analytics/focus-patterns:
    get:
      description: Heatmap, weekday scores, deep-work slots and distraction trend
        over the last N days, computed by the analytics service.
      parameters:
      - description: Days to cover (7-365, defaults to 30)
        example: 30
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Focus patterns
      tags:
      - Analytics
  /analytics/smart-schedule:
    post:
      consumes:
      - application/json
      description: Proxies request to Python to generate a weekly schedule based on
        user's past habits.
      parameters:
      - description: Smart schedule request (commitments and goals)
        in: body
        name: body
        required: true
        schema: {}
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Generate smart schedule
      tags:
      - Analytics
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns a JWT token. Failures are throttled
        per (email, IP) with a progressive delay (429 + Retry-After) and per IP; after
        3 failures for an email within 15 minutes, a Turnstile token is required (401
        with captchaRequired).
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.LoginErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Login
      tags:
      - Auth
  /auth/logout:
    post:
      description: Revokes every token issued to the authenticated user
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Log out everywhere
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new user account with role "user" and returns a JWT token
      parameters:
      - description: Registration data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Register a new user
      tags:
      - Auth
  /dashboard/today:
    get:
      description: Planned/done minutes and focus-score components for today in the
        user's time zone, computed by the analytics service.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Today's dashboard metrics
      tags:
      - Dashboard
  /features:
    get:
      description: Ids of the features switched on with FEATURE_<id>=true on the server.
        Anything not listed is off.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.FeaturesResponse'
      security:
      - BearerAuth: []
      summary: Enabled feature flags
      tags:
      - Features
  /me:
    get:
      description: Returns the authenticated user's profile
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - Auth
    put:
      consumes:
      - application/json
      description: Updates the authenticated user's name, email, and/or password.
        Changing email or password requires oldPassword.
      parameters:
      - description: Profile update data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update user profile
      tags:
      - Auth
  /quote:
    get:
      description: Returns a motivational quote. Cached for 2-3 hours, refreshes automatically.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.CachedQuote'
      security:
      - BearerAuth: []
      summary: Get motivational quote
      tags:
      - Quotes
  /tasks:
    get:
      description: Returns tasks for the authenticated user, optionally filtered by
        date
      parameters:
      - description: Filter by date (YYYY-MM-DD)
        example: "2026-03-02"
        in: query
        name: date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List tasks
      tags:
      - Tasks
    post:
      consumes:
      - application/json
      description: Creates a time block for the authenticated user
      parameters:
      - description: Task data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a new task
      tags:
      - Tasks
  /tasks/{id}:
    delete:
      description: Deletes a task by ID
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a task
      tags:
      - Tasks
    put:
      consumes:
      - application/json
      description: Partially updates a task (status, distractions, etc.)
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a task
      tags:
      - Tasks
  /tasks/{id}/distractions:
    post:
      consumes:
      - application/json
      description: Atomically adds delta (1 or -1) to a block's distraction count,
        clamped to 0-100
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: integer
      - description: Delta
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.AdjustDistractionsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Increment or decrement distractions
      tags:
      - Tasks
  /tasks/bulk:
    post:
      consumes:
      - application/json
      description: Creates multiple time blocks for the authenticated user
      parameters:
      - description: Array of tasks
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.BulkCreateTasksRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create multiple tasks
      tags:
      - Tasks
  /tasks/plan:
    put:
      consumes:
      - application/json
      description: Replaces the blocks previously generated for that week (manual
        blocks are kept) in one transaction.
      parameters:
      - description: Week and blocks
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.SavePlanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Save a generated weekly plan
      tags:
      - Tasks
  /vocabulary:
    get:
      description: Returns vocabulary words for the authenticated user with pagination
        and optional language filter
      parameters:
      - description: 'Language filter: english or russian'
        in: query
        name: lang
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 30)
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get all vocabulary words
      tags:
      - Vocabulary
  /vocabulary/{id}/learned:
    put:
      description: Toggles the learned flag for a vocabulary word
      parameters:
      - description: Word ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Toggle word learned status
      tags:
      - Vocabulary
  /vocabulary/{id}/saved:
    put:
      description: Toggles the saved flag for a vocabulary word
      parameters:
      - description: Word ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Toggle word saved status
      tags:
      - Vocabulary
  /vocabulary/today:
    get:
      description: Returns 2 words for today (1 English C1-C2, 1 Russian A2+). Fetches
        from external API on first call of the day.
      parameters:
      - description: Date (YYYY-MM-DD), defaults to today
        in: query
        name: date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get today's vocabulary words
      tags:
      - Vocabulary
securityDefinitions:
  BearerAuth:
    description: 'Enter your JWT token with the Bearer prefix: "Bearer <token>"'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
